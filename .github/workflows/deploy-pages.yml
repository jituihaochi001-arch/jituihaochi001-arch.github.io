name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Resolve Pages base path
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Reject subpath deployment
        # 主题仍有约 69 条配置驱动的站内链接写死在根路径，项目站（/仓库名/）会 404
        if: steps.pages.outputs.base_path != '' && steps.pages.outputs.base_path != '/'
        run: |
          echo "::error title=部署路径不受支持::GitHub Pages 把本站放在 '${{ steps.pages.outputs.base_path }}' 子路径下。请把仓库命名为 <用户名>.github.io，或在 Settings → Pages 绑定自定义域名后再部署。"
          exit 1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PUBLIC_SITE_URL: ${{ steps.pages.outputs.origin }}${{ steps.pages.outputs.base_path }}
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
